version: 2
models:
  - name: stg_revisions
    description: Immutable per-run source revision snapshot, tenant/run filtered under forced RLS.
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: entity_version
        data_tests: [not_null]
  - name: order_facts
    description: One latest authoritative snapshot per order, never additive sales events.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
      - name: total_minor
        data_tests: [not_null]
  - name: product_history
    description: Highest version at each effective timestamp, then half-open LEAD intervals.
    columns:
      - name: valid_from
        data_tests: [not_null]
