[project]
name = "orderflow"
version = "0.2.0"
description = "Durable, tenant-isolated operational data ingestion and quality reporting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.4",
  "PyJWT[crypto]==2.15.1",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
  "httpx==0.28.1",
  "vercel-queue[typed]==0.11.2",
  "dbt-core==1.12.7",
  "dbt-postgres==1.11.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"



[[tool.vercel.subscribers]]
entrypoint = "queue_worker"
