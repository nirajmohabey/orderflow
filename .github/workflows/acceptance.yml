name: Acceptance and reproducible quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-batch-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ODF_CI_BOOTSTRAP: owned-ephemeral
      ODF_CI_ADMIN_URL: postgresql+psycopg://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: 3.12.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: 26.13.1
      - name: Install locked app and separate batch environments
        run: |
          python -m pip install uv==0.11.25
          uv sync --frozen
          uv venv .venv-dbt --python 3.12.14
          uv pip install --python .venv-dbt/bin/python --require-hashes -r warehouse/requirements-dbt.lock
          uv venv .venv-airflow --python 3.12.14
          uv pip install --python .venv-airflow/bin/python -r orchestration/requirements-airflow.in --constraint orchestration/constraints-hardened-3.12.txt
          uv pip check --python .venv-dbt/bin/python
          uv pip check --python .venv-airflow/bin/python
      - name: Provision fresh CI identities without Windows cluster bootstrap
        run: .venv/bin/python scripts/ci_setup.py
      - name: Real PostgreSQL suite and independent recovery
        run: |
          .venv/bin/python scripts/run_tests.py --label ci --junitxml artifacts/ci/pytest.xml -q
          .venv/bin/python scripts/run_tests.py --label ci --harness acceptance --proof artifacts/ci/acceptance.source-proof.json
          .venv/bin/python scripts/run_tests.py --label ci --harness recovery --proof artifacts/ci/recovery.source-proof.json
          .venv/bin/python scripts/run_tests.py --label ci --harness backup --proof artifacts/ci/backup.source-proof.json
      - name: Actual finite Airflow DAG, dbt and parser regression
        run: |
          .venv/bin/python scripts/populate_demo.py
          .venv/bin/python scripts/ci_airflow.py
          .venv-airflow/bin/python scripts/check_dns_bounds.py
      - name: Exact graphs and known advisory/source checks
        run: |
          .venv/bin/python scripts/collect_dependencies.py --output artifacts/security/application-installed.json
          .venv-dbt/bin/python scripts/collect_dependencies.py --output artifacts/security/dbt-installed.json
          .venv-airflow/bin/python scripts/collect_dependencies.py --output artifacts/security/airflow-installed.json
          .venv/bin/python scripts/security_audit.py
      - name: Full static findings and reviewed call-site gate
        run: |
          uv venv .venv-audit --python 3.12.14
          uv pip install --python .venv-audit/bin/python bandit==1.9.4 ruff==0.17.6
          .venv-audit/bin/python scripts/static_audit.py
      - name: Build dashboard and inspect actual browser flows
        working-directory: dashboard
        run: |
          npm ci
          npm run check:format
          npm run build
          npx playwright install --with-deps chrome
          npm run test:browser
      - name: Browser through the real API and PostgreSQL
        run: .venv/bin/python scripts/ci_live.py
      - name: Preserve bounded evidence, excluding private runtime/credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: postgres-batch-browser-evidence
          path: |
            artifacts/ci/
            artifacts/checks/
            artifacts/security/
            artifacts/dashboard/
          retention-days: 7
          include-hidden-files: false

  docker-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: 3.12.14
      - name: Install locked inspection client and generate ignored fixture secrets
        run: |
          python -m pip install uv==0.11.25
          uv sync --frozen
          .venv/bin/python scripts/docker_env.py
      - name: Build shipped images and verify the owned Compose stack
        run: .venv/bin/python scripts/ci_docker_smoke.py
      - name: Preserve container acceptance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: docker-evidence
          path: artifacts/ci/docker-smoke.json
          retention-days: 7
